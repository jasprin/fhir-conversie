<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architectuur FHIR-conversie</title>
  <desc>Bovenaan beheer: Git-repository naar CI-pipeline naar gecompileerde StructureMaps per conversierichting, die de converter laadt. Onderaan runtime: X levert een Bundle in de bronversie aan de converter (HL7 FHIR Validator), Y ontvangt de Bundle in de doelversie, bijvoorbeeld R4 naar STU3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .teal .t { fill: #085041; }
      .teal .s { fill: #0F6E56; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray .t { fill: #444441; }
      .gray .s { fill: #5F5E5A; }
      .t { font-size: 14px; font-weight: 500; }
      .s { font-size: 12px; }
      .lbl { font-size: 12px; fill: #5F5E5A; }
      .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
      .cont { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="680" height="390" fill="#FFFFFF"/>

  <rect class="cont" x="30" y="20" width="620" height="130" rx="12"/>
  <text class="lbl" x="46" y="42">Beheer en kwaliteit (ontwerptijd)</text>
  <g class="teal">
    <rect x="60" y="64" width="160" height="56" rx="8" stroke-width="0.75"/>
    <text class="t" x="140" y="84" text-anchor="middle" dominant-baseline="central">Git-repository</text>
    <text class="s" x="140" y="102" text-anchor="middle" dominant-baseline="central">FML-maps, testberichten</text>
  </g>
  <g class="teal">
    <rect x="260" y="64" width="160" height="56" rx="8" stroke-width="0.75"/>
    <text class="t" x="340" y="84" text-anchor="middle" dominant-baseline="central">CI-pipeline</text>
    <text class="s" x="340" y="102" text-anchor="middle" dominant-baseline="central">bouwen, testen, valideren</text>
  </g>
  <g class="teal">
    <rect x="460" y="64" width="160" height="56" rx="8" stroke-width="0.75"/>
    <text class="t" x="540" y="84" text-anchor="middle" dominant-baseline="central">StructureMaps</text>
    <text class="s" x="540" y="102" text-anchor="middle" dominant-baseline="central">per conversierichting</text>
  </g>
  <line class="arr" x1="220" y1="92" x2="256" y2="92" marker-end="url(#arrow)"/>
  <line class="arr" x1="420" y1="92" x2="456" y2="92" marker-end="url(#arrow)"/>
  <path class="arr" d="M540 120 L540 168 L350 168 L350 232" marker-end="url(#arrow)"/>

  <rect class="cont" x="30" y="190" width="620" height="140" rx="12"/>
  <text class="lbl" x="46" y="212">Runtime</text>
  <g class="gray">
    <rect x="50" y="236" width="160" height="64" rx="8" stroke-width="0.75"/>
    <text class="t" x="130" y="258" text-anchor="middle" dominant-baseline="central">X</text>
    <text class="s" x="130" y="278" text-anchor="middle" dominant-baseline="central">levert Bundle</text>
  </g>
  <g class="teal">
    <rect x="260" y="236" width="180" height="64" rx="8" stroke-width="0.75"/>
    <text class="t" x="350" y="258" text-anchor="middle" dominant-baseline="central">Converter</text>
    <text class="s" x="350" y="278" text-anchor="middle" dominant-baseline="central">HL7 FHIR Validator</text>
  </g>
  <g class="gray">
    <rect x="490" y="236" width="140" height="64" rx="8" stroke-width="0.75"/>
    <text class="t" x="560" y="258" text-anchor="middle" dominant-baseline="central">Y</text>
    <text class="s" x="560" y="278" text-anchor="middle" dominant-baseline="central">ontvangt Bundle</text>
  </g>
  <text class="lbl" x="235" y="256" text-anchor="middle">bron</text>
  <line class="arr" x1="210" y1="268" x2="256" y2="268" marker-end="url(#arrow)"/>
  <text class="lbl" x="465" y="256" text-anchor="middle">doel</text>
  <line class="arr" x1="440" y1="268" x2="486" y2="268" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="40" y="352" width="14" height="14" rx="3" stroke-width="0.75"/></g>
  <text class="lbl" x="62" y="363">Deze repository</text>
  <g class="gray"><rect x="220" y="352" width="14" height="14" rx="3" stroke-width="0.75"/></g>
  <text class="lbl" x="242" y="363">Buiten deze repository</text>
</svg>
